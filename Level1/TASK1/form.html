<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Simple Form</title>

  <style>
    body {
      font-family: 'Times New Roman', Times, serif;
      text-align: center;
      padding: 60px;
    }

    h2 {
      color: #333;
    }

    form {
      background: rgb(233, 189, 189);
      display: inline-block;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(47, 42, 42, 0.15);
    }

    input {
      padding: 10px;
      width: 220px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      margin-left: 10px;
      background-color: #2c7be5;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1a5bb8;
    }
  </style>
</head>
<body>

  <h2>Enter Your Name</h2>

  <form>
    <input type="text" placeholder="Type your name here">
    <button type="submit">Submit</button>
  </form>

</body>
</html>
