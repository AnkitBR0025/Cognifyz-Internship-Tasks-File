<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulma Card</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
</head>
<body>

  <section class="section">
    <div class="container">

      <h1 class="title has-text-centered">Card Component</h1>
      <p class="subtitle has-text-centered">Made with Bulma</p>

      <!-- card is centered and changes width on different screens -->
      <div class="columns is-centered">
        <div class="column is-12-mobile is-6-tablet is-4-desktop">

          <div class="card">
            <div class="card-image">
              <figure class="image is-4by3">
                <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=600" alt="Web Development">
              </figure>
            </div>
            <div class="card-content">
              <h2 class="title is-4">Web Development</h2>
              <p class="content">Learn how to build websites that look good on mobile, tablet and laptop.</p>
              <a href="#" class="button is-link is-fullwidth">Read More</a>
            </div>
          </div>

        </div>
      </div>

    </div>
  </section>

</body>
</html>
