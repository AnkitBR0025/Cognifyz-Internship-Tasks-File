<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamburger Menu</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    nav {
      background-color: #2c3e50;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .logo {
      color: white;
      font-size: 22px;
      font-weight: bold;
    }
    .menu {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      gap: 25px;
    }

    .menu a {
      color: white;
      text-decoration: none;
    }
    .menu a:hover {
      color: #f1c40f;
    }

    .hamburger {
      display: none;
      color: white;
      font-size: 28px;
      cursor: pointer;
    }
    #check {
      display: none;
    }

    @media (max-width: 600px) {
      .hamburger {
        display: block;
      }

      .menu {
        display: none;
        width: 100%;
        flex-direction: column;
        gap: 0;
        margin-top: 10px;
      }
      .menu li {
        padding: 12px 0;
        border-top: 1px solid #4a5f73;
      }

      #check:checked ~ .menu {
        display: flex;
      }
    }

    .content {
      padding: 20px;
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo">MySite</div>

    <input type="checkbox" id="check">
    <label for="check" class="hamburger">&#9776;</label>

    <ul class="menu">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>
  <div class="content">
    <h2>Welcome</h2>
    <p>Make the screen small to see the hamburger menu.</p>
  </div>
</body>
</html>
